name: Compile Web App to iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Create Capacitor wrapper
      - name: Create App Wrapper and Install
        run: |
          echo '{
            "name": "fnae-meme",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/ios": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }' > package.json

          echo '{
            "appId": "com.meme.fnae",
            "appName": "FNAE Meme",
            "webDir": "www"
          }' > capacitor.config.json

          npm install
          npx cap add ios
          npx cap sync ios

      # 4. Compile unsigned Xcode archive
      - name: Compile Unsigned Xcode Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 5. Create proper IPA structure
      - name: Create Payload Folder
        run: |
          rm -rf IPA
          mkdir -p IPA/Payload

          cp -R \
            build/App.xcarchive/Products/Applications/App.app \
            IPA/Payload/App.app

          echo "IPA structure:"
          find IPA -maxdepth 2 -type d

      # 6. Zip Payload and rename ZIP to IPA
      - name: Package IPA
        run: |
          cd IPA

          # Create ZIP containing Payload/App.app
          zip -r -q ../FNAE_Meme.zip Payload

          cd ..

          # Rename ZIP to IPA
          mv FNAE_Meme.zip FNAE_Meme.ipa

          echo "Created IPA:"
          ls -lh FNAE_Meme.ipa

          echo "IPA contents:"
          unzip -l FNAE_Meme.ipa | head -30

      # 7. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FNAE Meme Build ${{ github.run_number }}
          files: FNAE_Meme.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
