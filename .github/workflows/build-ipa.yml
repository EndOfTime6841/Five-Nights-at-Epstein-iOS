name: Compile Web App to iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger this via the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create App Wrapper and Install
        run: |
          # 1. Dynamically generate the required project configuration files
          echo '{"name": "fnae-meme", "version": "0.0.8", "dependencies": {"@capacitor/core": "^6.0.0", "@capacitor/ios": "^6.0.0"}, "devDependencies": {"@capacitor/cli": "^6.0.0"}}' > package.json
          echo '{"appId": "com.meme.fnae", "appName": "FNAE Meme", "webDir": "www"}' > capacitor.config.json
          
          # 2. Safely run install and build steps sequentially in a single container environment
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Compile Unsigned Xcode Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Archive into IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          cd Payload
          zip -r ../FNAE_Meme.ipa .
          cd ..

           - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FNAE Meme Build ${{ github.run_number }}
          files: FNAE_Meme.ipa
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
